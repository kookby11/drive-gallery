<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>แกลเลอรีภาพ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Playfair+Display:wght@600&family=Prompt:wght@400;600&family=Mali:wght@500;700&family=Noto+Serif+Thai:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero" id="hero">
  <img id="heroA" alt="">
  <img id="heroB" alt="">
  <div class="hero-actions">
    <button class="icon-btn" id="themeBtn" title="สลับโหมดสว่าง/มืด">◐</button>
  </div>
  <div class="hero-text">
    <div class="brand" id="brand"></div>
    <div class="subtitle" id="subtitle"></div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </div>
</header>

<main class="container">
  <div class="toolbar" id="toolbar">
    <span class="count" id="count"></span>
    <button class="btn ghost small hidden" id="selAllBtn" type="button"></button>
    <button class="btn ghost small" id="densityBtn" type="button" data-i="density"></button>
    <button class="btn accent small" id="playBtn" type="button" data-i="slideshow"></button>
  </div>
  <div class="status" id="status"></div>
  <div class="gallery grid" id="gallery"></div>
</main>
<footer class="foot" id="foot"></footer>

<!-- แถบเมนูลอยด้านล่าง -->
<nav class="gbar hidden" id="gbar" aria-label="เมนูแกลเลอรี">
  <button type="button" id="btnQR">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
    <span data-i="qr"></span>
  </button>
  <button type="button" id="btnDownload">
    <svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
    <span data-i="download"></span>
    <span class="badge" id="pickCount">0</span>
  </button>
  <button type="button" id="btnSelect">
    <svg viewBox="0 0 24 24"><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8"/><path d="M8.5 11.5 12 15l8-8"/></svg>
    <span data-i="select"></span>
  </button>
  <button type="button" id="btnLang">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
    <span data-i="language"></span>
  </button>
  <button type="button" id="btnPhoto" class="hidden">
    <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span data-i="photographer"></span>
  </button>
</nav>

<!-- กล่อง QR -->
<div class="qr-modal" id="qrModal">
  <div class="card">
    <h2 style="justify-content:center">QR Code</h2>
    <div class="qr" id="qrBox"></div>
    <div style="display:flex;gap:8px">
      <button class="btn ghost block" type="button" id="qrCopy" data-i="copyLink"></button>
      <button class="btn block" type="button" id="qrClose" data-i="close"></button>
    </div>
  </div>
</div>

<!-- กล่องช่างภาพ / ช่องทางติดต่อ -->
<div class="qr-modal pg-modal" id="pgModal">
  <div class="card">
    <div class="pg-head">
      <h2 data-i="contactTitle"></h2>
      <p class="pg-who" id="pgWho"></p>
      <p data-i="contactSub"></p>
    </div>
    <div class="pg-list" id="pgList"></div>
    <button class="btn block" type="button" id="pgClose" data-i="close"></button>
  </div>
</div>

<!-- กล่องบันทึกรูปลงอัลบั้ม -->
<div class="qr-modal dl-modal" id="dlModal">
  <div class="card">
    <button class="dl-x" id="dlClose" type="button" aria-label="Close">✕</button>
    <h2 id="dlTitle"></h2>
    <div class="dl-list" id="dlList"></div>
    <p class="hint" id="dlNote"></p>
    <button class="btn accent block" id="dlSave" type="button" disabled></button>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lb-top">
    <span class="counter" id="lbCounter"></span>
    <button class="lb-btn" id="lbPlay" type="button"></button>
    <button class="lb-btn" id="lbQr" type="button" data-i="lbQr"></button>
    <a class="lb-btn" id="lbDownload" target="_blank" rel="noopener" data-i="lbDownload"></a>
    <button class="lb-btn" id="lbFull" type="button" title="เต็มจอ">⛶</button>
    <button class="lb-btn" id="lbClose" type="button">✕</button>
  </div>
  <div class="lb-stage" id="lbStage">
    <button class="lb-nav lb-prev" id="lbPrev" type="button">‹</button>
    <img id="lbImg" alt="">
    <button class="lb-nav lb-next" id="lbNext" type="button">›</button>
  </div>
  <!-- QR สำหรับดาวน์โหลดรูปที่กำลังดู -->
  <div class="lb-qr hidden" id="lbQrPanel">
    <div id="lbQrBox"></div>
    <p data-i="lbQrNote"></p>
  </div>
</div>

<!-- แสดง error บนหน้าเว็บ ถ้าสคริปต์พัง (ช่วยหาสาเหตุโดยไม่ต้องเปิด F12) -->
<script>
window.addEventListener('error', function(e){
  var s = document.getElementById('status');
  if(s){ s.className = 'status error'; s.textContent = 'Error: ' + e.message; }
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
(function(){
const THUMB = 600, FULL = 2000;
let cfg = null, files = [], dense = false;
let lbIndex = -1, playTimer = null, heroTimer = null, heroFront = 'heroA';
let lbQrOn = false;
let contacts = null;
const loader = createThumbLoader();
const picked = new Set();
let selectMode = false;

// ---------- ภาษา (TH / EN) ----------
const I18N = {
  th: {
    qr:'QR Code', download:'ดาวน์โหลด', select:'เลือกรูป', language:'ภาษา', photographer:'ช่างภาพ',
    density:'⊞ ขนาดภาพ', slideshow:'▶ เล่นสไลด์โชว์', lbSlide:'▶ สไลด์โชว์', lbStop:'❚❚ หยุด',
    lbDownload:'⬇ ดาวน์โหลด', lbQr:'QR ดาวน์โหลด', lbQrNote:'สแกนเพื่อดาวน์โหลดรูปนี้',
    photos:' ภาพ', loading:'กำลังโหลดภาพ...', empty:'ยังไม่มีภาพในอัลบั้มนี้',
    selectAll:'เลือกทั้งหมด', clearAll:'ล้างที่เลือก', copyLink:'คัดลอกลิงก์', close:'ปิด', copied:'คัดลอกลิงก์แล้ว',
    pickFirst:'แตะรูปที่ต้องการ แล้วกดดาวน์โหลด', selectOn:'โหมดเลือกรูป: แตะรูปเพื่อเลือก',
    confirmDl:(n)=>`ดาวน์โหลด ${n} รูป? เบราว์เซอร์อาจถามให้อนุญาตการดาวน์โหลดหลายไฟล์`,
    dlStart:(n)=>`กำลังเริ่มดาวน์โหลด ${n} รูป`,
    contactTitle:'ติดต่อช่างภาพ', contactSub:'เลือกช่องทางที่สะดวก', call:'โทร'
  },
  en: {
    qr:'QR Code', download:'Download', select:'Select', language:'Language', photographer:'Photographer',
    density:'⊞ Grid size', slideshow:'▶ Slideshow', lbSlide:'▶ Slideshow', lbStop:'❚❚ Stop',
    lbDownload:'⬇ Download', lbQr:'QR download', lbQrNote:'Scan to download this photo',
    photos:' photos', loading:'Loading photos...', empty:'No photos in this album yet',
    selectAll:'Select all', clearAll:'Clear', copyLink:'Copy link', close:'Close', copied:'Link copied',
    pickFirst:'Tap the photos you want, then press Download', selectOn:'Select mode: tap photos to choose',
    confirmDl:(n)=>`Download ${n} photos? Your browser may ask to allow multiple downloads.`,
    dlStart:(n)=>`Starting download of ${n} photos`,
    contactTitle:'Contact the photographer', contactSub:'Choose how you would like to reach out', call:'Call'
  }
};
let lang = 'th';
try{ lang = localStorage.getItem('gl') || 'th'; }catch(e){}
const t = (k, ...a) => { const v = I18N[lang][k]; return typeof v === 'function' ? v(...a) : v; };

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  $('lbPlay').textContent = playTimer ? t('lbStop') : t('lbSlide');
  renderCounts();
  updateSelectUI();
  if($('pgModal').classList.contains('open')) renderContacts();
}
function toggleLang(){
  lang = lang === 'th' ? 'en' : 'th';
  try{ localStorage.setItem('gl', lang); }catch(e){}
  applyLang();
}

const gbarToast = (msg) => toast(msg);   // toast() อยู่ใน common.js

// ---------- ช่างภาพ / ช่องทางติดต่อ (อ่านจากพารามิเตอร์ p ในลิงก์) ----------
function decodeContacts(){
  try{
    const p = new URLSearchParams(location.search).get('p');
    if(!p) return null;
    let s = p.replace(/-/g, '+').replace(/_/g, '/');
    while(s.length % 4) s += '=';
    const bin = atob(s);
    const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
    const obj = JSON.parse(new TextDecoder().decode(bytes));
    return (obj && typeof obj === 'object') ? obj : null;
  }catch(e){ return null; }
}

const IC = {
  fb: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-8h2.7l.4-3.2h-3.1V7.8c0-.9.3-1.5 1.6-1.5h1.7V3.4c-.3 0-1.3-.1-2.4-.1-2.4 0-4.1 1.5-4.1 4.2v2.3H7.6V13h2.7v8h3.2z"/></svg>',
  ln: 'LINE',
  tel: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"/></svg>',
  ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r="1.1" fill="currentColor" stroke="none"/></svg>',
  tt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3a5 5 0 0 0 4 4.4v3a8 8 0 0 1-4-1.2v6.3a6.5 6.5 0 1 1-6.5-6.5h.5v3.1a3.4 3.4 0 1 0 2.9 3.4V3h3.1z"/></svg>'
};

// สร้างลิงก์ให้ปลอดภัย: ยอมรับเฉพาะ http(s) หรือชื่อผู้ใช้ที่เราเติมโดเมนให้เอง
function contactLinks(c){
  const out = [];
  if(!c) return out;
  const isUrl = (s) => /^https?:\/\//i.test(s);
  const clean = (s) => String(s || '').trim();
  const user = (s) => clean(s).replace(/^@/, '');
  const short = (s) => s.replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '');

  const fb = clean(c.fb);
  if(fb) out.push({ k:'fb', label:'Facebook', text: isUrl(fb) ? short(fb) : fb,
    href: isUrl(fb) ? fb : 'https://facebook.com/' + encodeURIComponent(user(fb)) });

  const ln = clean(c.ln);
  if(ln) out.push({ k:'ln', label:'LINE', text: isUrl(ln) ? short(ln) : ln,
    href: isUrl(ln) ? ln : (ln.startsWith('@') ? 'https://line.me/R/ti/p/' + encodeURIComponent(ln)
                                               : 'https://line.me/ti/p/~' + encodeURIComponent(ln)) });

  const tel = clean(c.tel);
  const digits = tel.replace(/[^\d+]/g, '');
  if(tel && digits) out.push({ k:'tel', label: t('call'), text: tel, href: 'tel:' + digits });

  const ig = clean(c.ig);
  if(ig) out.push({ k:'ig', label:'Instagram', text: isUrl(ig) ? short(ig) : '@' + user(ig),
    href: isUrl(ig) ? ig : 'https://instagram.com/' + encodeURIComponent(user(ig)) });

  const tt = clean(c.tt);
  if(tt) out.push({ k:'tt', label:'TikTok', text: isUrl(tt) ? short(tt) : '@' + user(tt),
    href: isUrl(tt) ? tt : 'https://www.tiktok.com/@' + encodeURIComponent(user(tt)) });

  return out;
}

function renderContacts(){
  const list = $('pgList');
  list.innerHTML = '';
  $('pgWho').textContent = (contacts && contacts.n) || (cfg && cfg.b) || '';
  $('pgWho').classList.toggle('hidden', !$('pgWho').textContent);
  contactLinks(contacts).forEach(it => {
    const a = document.createElement('a');
    a.className = 'pg-item';
    a.href = it.href;
    if(!it.href.startsWith('tel:')){ a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    const ic = document.createElement('span');
    ic.className = 'pg-ic pg-' + it.k;
    ic.innerHTML = IC[it.k];                       // ไอคอนเป็นค่าคงที่ในโค้ดนี้เท่านั้น
    const tx = document.createElement('span');
    tx.className = 'pg-t';
    const b = document.createElement('b'); b.textContent = it.label;
    const s = document.createElement('span'); s.textContent = it.text;
    tx.append(b, s);
    const go = document.createElement('span'); go.className = 'pg-go'; go.textContent = '›';
    a.append(ic, tx, go);
    list.appendChild(a);
  });
}
function openContacts(){ renderContacts(); $('pgModal').classList.add('open'); }
function closeContacts(){ $('pgModal').classList.remove('open'); }
$('btnPhoto').addEventListener('click', openContacts);
$('pgClose').addEventListener('click', closeContacts);
$('pgModal').addEventListener('click', e => { if(e.target.id === 'pgModal') closeContacts(); });

// ---------- เริ่มต้น ----------
cfg = decodeConfig(new URLSearchParams(location.search).get('c') || '');
contacts = decodeContacts();
applyLang();
$('btnPhoto').classList.toggle('hidden', !contactLinks(contacts).length);
if(!cfg || !cfg.f){
  showInvalid();
}else{
  applyTheme(cfg);
  renderHeader();
  loadPhotos();
}

function showInvalid(){
  $('hero').classList.add('plain');
  $('title').textContent = 'ลิงก์ไม่ถูกต้อง';
  $('toolbar').classList.add('hidden');
  setStatus('status', 'ลิงก์นี้ไม่สมบูรณ์ กรุณาติดต่อผู้ส่งลิงก์', 'error');
}

function renderHeader(){
  $('brand').textContent = cfg.b;
  $('subtitle').textContent = cfg.s;
  $('title').textContent = cfg.t || 'แกลเลอรีภาพ';
  $('foot').textContent = cfg.b ? '© ' + cfg.b : '';
  document.title = [cfg.t, cfg.b].filter(Boolean).join(' — ') || 'แกลเลอรีภาพ';
  if(cfg.cv === 'none') $('hero').classList.add('plain');
  if(!cfg.dl){
    $('lbDownload').classList.add('hidden');
    $('lbQr').classList.add('hidden');
    $('btnDownload').classList.add('hidden');
  }
}

function renderCounts(){
  if(!files.length) return;
  $('meta').textContent = [cfg && cfg.d, files.length + t('photos')].filter(Boolean).join(' · ');
  $('count').textContent = files.length + t('photos');
}

async function loadPhotos(){
  setStatus('status', t('loading'), 'info');
  try{
    files = await fetchDriveFiles(cfg.f, cfg.so);
    setStatus('status', files.length ? '' : t('empty'), 'info');
    renderCounts();
    $('toolbar').classList.toggle('hidden', !files.length);
    $('gbar').classList.toggle('hidden', !files.length);
    renderGallery();
    renderHero();
  }catch(err){
    $('toolbar').classList.add('hidden');
    setStatus('status', friendlyError(err), 'error');
  }
}

// ---------- หน้าปก ----------
function renderHero(){
  if(cfg.cv === 'none' || !files.length) return;
  let start = files[0];
  if(cfg.cv === 'pick' && cfg.ci) start = files.find(f => f.id === cfg.ci) || files[0];
  showHero(start);
  if(cfg.cv === 'slideshow' && files.length > 1){
    let i = 0;
    heroTimer = setInterval(() => { i = (i + 1) % files.length; showHero(files[i]); }, 6000);
  }
}
function showHero(file){
  const cur = $(heroFront);
  const next = heroFront === 'heroA' ? $('heroB') : $('heroA');
  const pre = new Image();
  let triedAlt = false;
  pre.onload = () => {
    next.src = pre.src;
    next.classList.remove('kb');
    void next.offsetWidth;            // เริ่มเอฟเฟกต์ซูมใหม่
    next.classList.add('show', 'kb');
    cur.classList.remove('show');
    heroFront = next.id;
  };
  pre.onerror = () => { if(!triedAlt){ triedAlt = true; pre.src = driveThumbUrl(file.id, 1600, 1); } };
  pre.src = thumbUrl(file, 1600);
}

// ---------- แกลเลอรี ----------
function ratioOf(f){
  const m = f.imageMediaMetadata;
  if(!m || !m.width || !m.height) return '3/4';
  return (m.rotation === 1 || m.rotation === 3) ? `${m.height}/${m.width}` : `${m.width}/${m.height}`;
}
function renderGallery(){
  loader.reset();
  const g = $('gallery');
  g.innerHTML = '';
  g.className = 'gallery ' + cfg.ly + (dense ? ' dense' : '');
  files.forEach((f, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.id = f.id;
    if(picked.has(f.id)) cell.classList.add('picked');
    if(cfg.ly === 'masonry') cell.style.aspectRatio = ratioOf(f);
    const img = document.createElement('img');
    img.alt = f.name || '';
    img.decoding = 'async';
    cell.appendChild(img);
    cell.addEventListener('click', () => {
      if(selectMode) togglePick(cell, f.id);
      else openLightbox(i);
    });
    g.appendChild(cell);
    loader.watch(img, f, THUMB);
  });
}
$('densityBtn').addEventListener('click', () => { dense = !dense; $('gallery').classList.toggle('dense', dense); });
$('themeBtn').addEventListener('click', () => document.body.classList.toggle('dark'));

// ---------- โหมดเลือกรูป ----------
function updateSelectUI(){
  const n = picked.size;
  const b = $('pickCount');
  b.textContent = n;
  b.classList.toggle('show', n > 0);
  $('btnSelect').classList.toggle('active', selectMode);
  document.body.classList.toggle('select-mode', selectMode);
  $('selAllBtn').classList.toggle('hidden', !selectMode);
  $('selAllBtn').textContent = (files.length && n === files.length) ? t('clearAll') : t('selectAll');
}
function togglePick(cell, id){
  const on = cell.classList.toggle('picked');
  on ? picked.add(id) : picked.delete(id);
  updateSelectUI();
}
function setSelectMode(on){
  selectMode = on;
  if(!on){
    picked.clear();
    document.querySelectorAll('.cell.picked').forEach(c => c.classList.remove('picked'));
  }else{
    gbarToast(t('selectOn'));
  }
  updateSelectUI();
}
$('btnSelect').addEventListener('click', () => setSelectMode(!selectMode));
$('selAllBtn').addEventListener('click', () => {
  const all = picked.size !== files.length;
  picked.clear();
  if(all) files.forEach(f => picked.add(f.id));
  document.querySelectorAll('.cell').forEach(c => c.classList.toggle('picked', all));
  updateSelectUI();
});

// ---------- บันทึกรูปลงอัลบั้ม (มือถือ) / ดาวน์โหลด (คอม) ----------
const SHARE_BATCH = 20;
const DLT = {
  th: {
    prep:'กำลังเตรียมรูปภาพ', prepN:(i,n)=>`กำลังเตรียมรูปภาพ (ชุด ${i}/${n})`,
    ready:'พร้อมบันทึกแล้ว', readyN:(i,n)=>`พร้อมบันทึกแล้ว (ชุด ${i}/${n})`, done:'บันทึกครบแล้ว',
    note:'กด "บันทึกลงอัลบั้ม" แล้วเลือก "บันทึกรูปภาพ" (iPhone) หรือบันทึกลงแกลเลอรี (Android)',
    save:'บันทึกลงอัลบั้ม', saveN:(i,n)=>`บันทึกลงอัลบั้ม (ชุด ${i}/${n})`,
    photoN:(i)=>`รูปที่ ${i}`, fail:'โหลดรูปไม่สำเร็จ ลองใหม่อีกครั้ง'
  },
  en: {
    prep:'Preparing photos', prepN:(i,n)=>`Preparing photos (batch ${i}/${n})`,
    ready:'Ready to save', readyN:(i,n)=>`Ready to save (batch ${i}/${n})`, done:'All saved',
    note:'Tap "Save to album", then choose "Save Image" (iPhone) or save to Gallery (Android)',
    save:'Save to album', saveN:(i,n)=>`Save to album (batch ${i}/${n})`,
    photoN:(i)=>`Photo ${i}`, fail:'Could not load the photos. Please try again.'
  }
};
const dt = (k, ...a) => { const v = DLT[lang][k]; return typeof v === 'function' ? v(...a) : v; };

let dlBatches = [], dlBatchIdx = 0, dlSession = 0, dlReady = [];

function isMobileDevice(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);   // iPadOS
}
function canShareFiles(){
  if(!isMobileDevice()) return false;
  try{
    return !!(navigator.share && navigator.canShare &&
      navigator.canShare({ files: [new File(['x'], 'x.jpg', { type: 'image/jpeg' })] }));
  }catch(e){ return false; }
}
function chunk(arr, n){ const out = []; for(let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; }

async function toJpegBlob(blob){
  const bmp = await createImageBitmap(blob);
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  c.getContext('2d').drawImage(bmp, 0, 0);
  return new Promise(res => c.toBlob(b => res(b), 'image/jpeg', 0.92));
}
async function fetchPhotoFile(f){
  const urls = [thumbUrl(f, 3000), driveThumbUrl(f.id, 3000, 1)];
  for(const u of urls){
    try{
      const r = await fetch(u);
      if(!r.ok) continue;
      let b = await r.blob();
      if(!b.type.startsWith('image/')) continue;
      if(b.type !== 'image/jpeg' && b.type !== 'image/png'){
        const j = await toJpegBlob(b).catch(() => null);
        if(j) b = j;
      }
      const ext = b.type === 'image/png' ? 'png' : 'jpg';
      const base = (f.name || f.id).replace(/\.[^.]+$/, '');
      return new File([b], `${base}.${ext}`, { type: b.type });
    }catch(e){}
  }
  return null;
}

function savePhotos(list){
  if(!canShareFiles()) return legacyDownload(list);       // คอมพิวเตอร์ / เบราว์เซอร์ที่ไม่รองรับ
  if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
  dlBatches = chunk(list, SHARE_BATCH);
  dlBatchIdx = 0;
  $('dlNote').textContent = dt('note');
  $('dlModal').classList.add('open');
  prepareBatch();
}

async function prepareBatch(){
  const session = ++dlSession;
  const total = dlBatches.length, k = dlBatchIdx + 1;
  const batch = dlBatches[dlBatchIdx];
  const btn = $('dlSave'), listEl = $('dlList');
  dlReady = [];
  btn.disabled = true;
  btn.textContent = total > 1 ? dt('saveN', k, total) : dt('save');
  $('dlTitle').textContent = total > 1 ? dt('prepN', k, total) : dt('prep');
  listEl.innerHTML = '';

  const items = batch.map((f, i) => {
    const row = document.createElement('div'); row.className = 'dl-row';
    const img = document.createElement('img'); img.alt = ''; img.src = thumbUrl(f, 120);
    const name = document.createElement('span'); name.className = 'dl-name';
    name.textContent = dt('photoN', dlBatchIdx * SHARE_BATCH + i + 1);
    const st = document.createElement('span'); st.className = 'dl-st'; st.textContent = '…';
    row.append(img, name, st);
    listEl.appendChild(row);
    return { f, st, file: null };
  });

  let next = 0;
  const worker = async () => {
    while(next < items.length){
      const it = items[next++];
      const file = await fetchPhotoFile(it.f);
      if(session !== dlSession) return;
      if(file){ it.file = file; it.st.textContent = '✓'; it.st.classList.add('ok'); }
      else { it.st.textContent = '!'; it.st.classList.add('err'); }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  if(session !== dlSession) return;

  dlReady = items.filter(it => it.file).map(it => it.file);
  $('dlTitle').textContent = total > 1 ? dt('readyN', k, total) : dt('ready');
  if(!dlReady.length){ gbarToast(dt('fail')); return; }
  btn.disabled = false;
}

$('dlSave').addEventListener('click', async () => {
  if(!dlReady.length) return;
  try{
    await navigator.share({ files: dlReady });     // ต้องเรียกตรงจากการแตะปุ่มนี้
  }catch(e){
    if(e && e.name === 'AbortError') return;       // ผู้ใช้ปิดหน้าต่างแชร์เอง
    gbarToast(dt('fail'));
    return;
  }
  dlBatchIdx++;
  if(dlBatchIdx < dlBatches.length){
    prepareBatch();
  }else{
    $('dlTitle').textContent = dt('done');
    $('dlSave').disabled = true;
    setTimeout(() => { closeDl(); setSelectMode(false); }, 1200);
  }
});
function closeDl(){ dlSession++; $('dlModal').classList.remove('open'); }
$('dlClose').addEventListener('click', closeDl);
$('dlModal').addEventListener('click', e => { if(e.target.id === 'dlModal') closeDl(); });

// วิธีเดิม สำหรับคอมพิวเตอร์: โหลดทีละไฟล์
async function legacyDownload(list){
  if(list.length > 1 && !confirm(t('confirmDl', list.length))) return;
  gbarToast(t('dlStart', list.length));
  for(const f of list){
    const fr = document.createElement('iframe');
    fr.style.display = 'none';
    fr.src = `https://drive.google.com/uc?export=download&id=${f.id}`;
    document.body.appendChild(fr);
    setTimeout(() => fr.remove(), 60000);
    await new Promise(r => setTimeout(r, 900));
  }
}

$('btnDownload').addEventListener('click', () => {
  const list = files.filter(f => picked.has(f.id));
  if(!list.length){
    if(!selectMode) setSelectMode(true);
    gbarToast(t('pickFirst'));
    return;
  }
  savePhotos(list);
});

// ปุ่มดาวน์โหลดใน lightbox: บนมือถือให้บันทึกรูปที่กำลังดูลงอัลบั้ม
$('lbDownload').addEventListener('click', e => {
  if(!canShareFiles() || lbIndex < 0) return;
  e.preventDefault();
  savePhotos([files[lbIndex]]);
});

// ---------- QR Code ----------
function openQR(){
  const box = $('qrBox');
  box.innerHTML = '';
  try{
    new QRCode(box, { text: location.href, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.L });
  }catch(e){
    box.textContent = lang === 'th' ? 'ลิงก์ยาวเกินกว่าจะสร้าง QR' : 'Link too long for a QR code';
  }
  $('qrModal').classList.add('open');
}
function closeQR(){ $('qrModal').classList.remove('open'); }
$('btnQR').addEventListener('click', openQR);
$('qrClose').addEventListener('click', closeQR);
$('qrModal').addEventListener('click', e => { if(e.target.id === 'qrModal') closeQR(); });
$('qrCopy').addEventListener('click', async () => {
  const ok = await copyText(location.href);
  if(ok) gbarToast(t('copied'));
});

// ---------- ภาษา ----------
$('btnLang').addEventListener('click', toggleLang);

// ---------- QR ดาวน์โหลดรูปที่กำลังดูใน lightbox ----------
function renderLbQr(){
  const box = $('lbQrBox');
  box.innerHTML = '';
  const f = files[lbIndex];
  if(!f) return;
  const url = `https://drive.google.com/uc?export=download&id=${f.id}`;
  try{
    new QRCode(box, { text: url, width: 132, height: 132, correctLevel: QRCode.CorrectLevel.L });
  }catch(e){}
}
function setLbQr(on){
  lbQrOn = on;
  $('lbQrPanel').classList.toggle('hidden', !on);
  $('lbQr').classList.toggle('on', on);
  if(on) renderLbQr();
}
$('lbQr').addEventListener('click', () => setLbQr(!lbQrOn));

// ---------- Lightbox ----------
function openLightbox(i){
  lbIndex = i;
  showLb();
  $('lightbox').classList.add('open');
  $('gbar').classList.add('hide');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  stopPlay();
  setLbQr(false);
  $('lightbox').classList.remove('open');
  $('gbar').classList.remove('hide');
  document.body.style.overflow = '';
  lbIndex = -1;
  if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
function showLb(){
  const n = files.length;
  if(!n) return;
  lbIndex = ((lbIndex % n) + n) % n;
  const idx = lbIndex, f = files[idx];
  setImg($('lbImg'), f, THUMB);              // แสดงรูปเล็กที่โหลดไว้แล้วทันที
  const hi = new Image();
  let triedAlt = false;
  hi.onload = () => { if(lbIndex === idx) $('lbImg').src = hi.src; };
  hi.onerror = () => { if(!triedAlt){ triedAlt = true; hi.src = driveThumbUrl(f.id, FULL, 1); } };
  hi.src = thumbUrl(f, FULL);
  $('lbCounter').textContent = `${idx + 1} / ${n}`;
  if(cfg.dl) $('lbDownload').href = `https://drive.google.com/uc?export=download&id=${f.id}`;
  if(lbQrOn) renderLbQr();                   // เปลี่ยนรูป → QR เปลี่ยนตาม
  [1, -1].forEach(d => { new Image().src = thumbUrl(files[(idx + d + n) % n], FULL); });   // โหลดรูปถัดไปรอไว้
}
function go(step){ stopPlay(); lbIndex += step; showLb(); }

function startPlay(){
  stopPlay();
  $('lbPlay').textContent = t('lbStop');
  playTimer = setInterval(() => { lbIndex++; showLb(); }, 4000);
}
function stopPlay(){
  clearInterval(playTimer); playTimer = null;
  $('lbPlay').textContent = t('lbSlide');
}
function goFullscreen(){
  const el = $('lightbox');
  if(el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {});
}

$('lbClose').addEventListener('click', closeLightbox);
$('lbPrev').addEventListener('click', e => { e.stopPropagation(); go(-1); });
$('lbNext').addEventListener('click', e => { e.stopPropagation(); go(1); });
$('lbPlay').addEventListener('click', () => playTimer ? stopPlay() : startPlay());
$('lbFull').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : goFullscreen());
$('lbStage').addEventListener('click', e => { if(e.target.id === 'lbStage') closeLightbox(); });
$('playBtn').addEventListener('click', () => { openLightbox(0); goFullscreen(); startPlay(); });

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if($('dlModal').classList.contains('open')){ closeDl(); return; }
    if($('pgModal').classList.contains('open')){ closeContacts(); return; }
    if($('qrModal').classList.contains('open')){ closeQR(); return; }
  }
  if(!$('lightbox').classList.contains('open')) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowLeft') go(-1);
  if(e.key === 'ArrowRight') go(1);
  if(e.key === ' '){ e.preventDefault(); playTimer ? stopPlay() : startPlay(); }
});

let touchX = null;
$('lbStage').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
$('lbStage').addEventListener('touchend', e => {
  if(touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if(Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
});
})();
</script>
